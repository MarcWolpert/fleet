<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --chrome:#141416; --chrome-2:#1e1e21; --win:#1d1d20; --side:#222226; --card:#29292e; --card-2:#313137;
  --hover:#ffffff0d; --sel:#3584e430; --line:#ffffff14; --line-2:#ffffff24;
  --ink:#f3f3f5; --ink-2:#c6c6cd; --ink-3:#9e9ea7;
  --accent:#78aeed; --accent-bg:#3584e4; --run:#33d17a;
  --t-base:#8a8984; --t-compose:#3987e5; --t-container:#199e70; --t-vm:#d95926;
  --track:#ffffff10;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--chrome);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:7px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:flex;flex-direction:column;height:100vh;min-height:560px}

/* herdr-style spaces bar */
.spacebar{display:flex;align-items:center;gap:14px;padding:9px 14px;background:var(--chrome);border-bottom:1px solid #000}
.lights{display:flex;gap:8px;flex:none}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.spaces{display:flex;gap:8px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px}
.spaces::-webkit-scrollbar{display:none}
.space{flex:0 1 auto;min-width:0;max-width:330px;display:flex;align-items:center;gap:10px;height:40px;padding:0 13px 0 6px;border-radius:11px;background:var(--chrome-2);border:1px solid transparent;color:var(--ink-2);font:500 13px/1 var(--mono)}
.space:hover{background:#252529}
.space.active{background:#2b2b30;border-color:#ffffff45;color:var(--ink)}
.space .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:84px}
.space:not(.active) .mini{display:none}
.space.active{flex-shrink:0}
.space .pc{color:var(--ink-3);font-size:12px;flex:none}
.mini{display:flex;width:32px;height:4px;border-radius:2px;overflow:hidden;background:var(--track);flex:none}
.mini i{display:block;height:100%}
.tile{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.tile svg{width:16px;height:16px}
.tile.fleet{background:#2c2c31;color:var(--ink-2)}
.tile.laptop{background:#7a4a35;color:#ffe3d6}
.tile.terminal{background:#15301c;color:#62e48f}
.tile.server{background:#3a2416;color:#ff9d62}
.tile.globe{background:#5b5fd6;color:#fff}
.tile.desktop{background:#16365a;color:#8cc8ff}
.tile.vm{background:#3d2215;color:#ff8d60}
.addbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.addbtn svg{width:16px;height:16px}
.addbtn:hover{background:var(--chrome-2);color:var(--ink)}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:9px 16px;background:var(--win);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:1 1 300px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.crumbs button{color:var(--ink-2);padding:4px 7px;border-radius:7px}
.crumbs button:hover{background:var(--hover);color:var(--ink)}
.crumbs .cur{color:var(--ink);font-weight:600;padding:4px 7px}
.crumbs .sep{color:#ffffff40}
.seg{display:inline-flex;background:var(--side);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 11px;border-radius:8px;font-size:13px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:#3a3a41;color:var(--ink)}
.badge{font:500 11px/1 var(--mono);color:var(--ink-3);border:1px solid var(--line-2);border-radius:999px;padding:6px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--run)}
#live{display:none}
#live.on{display:inline-flex}

/* body */
.body{flex:1;display:flex;min-height:0}
.side{width:390px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px 8px;font-size:12px;color:var(--ink-3)}
.side-h b{font-size:13px;color:var(--ink);font-weight:600}
.tree{flex:1;overflow:auto;padding:2px 6px 12px}
.row{display:flex;align-items:center;gap:6px;min-height:32px;padding-right:8px;padding-left:calc(2px + var(--d) * 17px);border-radius:7px;cursor:pointer;color:var(--ink-2)}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel);color:var(--ink)}
.row.machine .nm{color:var(--ink);font-weight:600}
.row.cronfolder .nm{color:var(--ink-3);font-style:italic}
.chev{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--ink-3);flex:none}
.chev:hover{background:var(--hover);color:var(--ink)}
.chev svg{width:12px;height:12px;transition:transform .15s}
.chev.open svg{transform:rotate(90deg)}
.chev.leaf{visibility:hidden}
.ico{width:18px;height:18px;display:grid;place-items:center;flex:none}
.ico svg{width:16px;height:16px}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;text-align:left;padding:6px 0}
.count{font:500 11px/1 var(--mono);color:var(--ink-3);background:#ffffff0d;border-radius:5px;padding:3px 5px;flex:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--run);flex:none;display:none}
.dot.on{display:block}
.spark{width:52px;height:16px;flex:none;overflow:visible}
.val{width:46px;text-align:right;font:500 12px/1 var(--mono);color:var(--ink-2);flex:none}
.side-note{margin:0 12px 12px;padding:10px 12px;border-radius:9px;background:#ffffff08;border:1px dashed var(--line-2);font-size:12px;color:var(--ink-3)}
.side-note b{color:var(--ink-2);font-weight:600}

main{flex:1;min-width:0;overflow:auto;background:var(--win)}
.wrap{max-width:1320px;padding:20px 24px 48px;display:flex;flex-direction:column;gap:16px}
.hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero .tile{width:46px;height:46px;border-radius:12px}
.hero .tile svg{width:24px;height:24px}
.hero h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-3);margin-top:3px}
.hero-stats{margin-left:auto;display:flex;gap:24px;flex-wrap:wrap}
.hs{text-align:right}
.hs .k{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em}
.hs .v{font:600 20px/1.25 var(--mono)}
.hs .s{font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card-h{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2{margin:0;font-size:14.5px;font-weight:600}
.card-h .sub{font-size:12.5px;color:var(--ink-3)}
.card-h .grow{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.sw.free{background:var(--track);box-shadow:inset 0 0 0 1px var(--line-2)}

.res{display:grid;grid-template-columns:112px minmax(0,1fr) 118px;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.legend + .res{border-top:0}
.res .lab{font-size:13px;color:var(--ink-2);font-weight:500}
.sbar{display:flex;height:14px;border-radius:4px;background:var(--track);overflow:hidden}
.sbar .s{height:100%;min-width:4px;border-right:2px solid var(--card)}
.sbar.empty{background:none;border:1px dashed var(--line-2);height:14px;font-size:11px;color:var(--ink-3);align-items:center;padding-left:8px}
.kvs{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--ink-3)}
.kvs span{display:inline-flex;align-items:center;gap:5px}
.kvs b{color:var(--ink-2);font-weight:500;font-family:var(--mono);font-size:11.5px}
.tot{text-align:right;font:600 13px/1.25 var(--mono)}
.tot small{display:block;font:400 11.5px/1.35 var(--sans);color:var(--ink-3)}

.graph{position:relative;height:190px;margin-right:62px;margin-top:10px}
.graph svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.gl span{position:absolute;left:100%;top:0;transform:translate(8px,-50%);font:500 11px/1 var(--mono);color:var(--ink-3);white-space:nowrap}
.gx{display:flex;justify-content:space-between;margin:6px 62px 0 0;font:500 11px/1 var(--mono);color:var(--ink-3)}
.cross{position:absolute;top:0;bottom:0;width:0;border-left:1px solid #ffffffa0;display:none;pointer-events:none}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:right;font-weight:500;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-family:var(--sans);font-size:13.5px}
.tbl td.l{text-align:left}
.namebtn{display:inline-flex;align-items:center;gap:8px;color:var(--ink);font-weight:500;padding:3px 0}
.namebtn:hover{color:var(--accent)}
.share{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.share .b{width:80px;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.share .b i{display:block;height:100%;border-radius:0 3px 3px 0}
.scroll-x{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1 var(--mono);color:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:4px 8px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.pill.on{color:var(--ink)}
.pill.on i{background:var(--run)}

.rank{display:grid;grid-template-columns:minmax(110px,180px) minmax(0,1fr) 128px;gap:8px 14px;align-items:center}
.rank .track{height:12px}
.rank .bar{height:12px;border-radius:0 4px 4px 0;min-width:3px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.st .k{font-size:12px;color:var(--ink-3)}
.st .v{font:600 21px/1.3 var(--mono)}
.st .s{font-size:12px;color:var(--ink-3);min-height:18px}
.st svg{width:100%;height:34px;margin-top:8px;display:block}

.dl{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 16px;margin:0;font-size:13px}
.dl dt{color:var(--ink-3)}
.dl dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.dl code{font:500 12.5px/1.4 var(--mono);color:var(--ink)}

.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:#3584e418;border:1px solid #3584e445;font-size:13px;color:var(--ink-2)}
.note svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--accent)}
.note b{color:var(--ink);font-weight:600}

.mrow{display:grid;grid-template-columns:minmax(170px,270px) minmax(0,1fr) 128px;gap:8px 14px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mbtn{display:flex;align-items:center;gap:10px;min-width:0;font:500 13px/1.2 var(--mono);color:var(--ink);padding:2px 0}
.mbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbtn:hover{color:var(--accent)}

.res .lab small{display:block;font-size:11px;font-weight:400;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtag{font:500 10.5px/1 var(--mono);color:var(--ink-2);border:1px solid var(--line-2);border-radius:5px;padding:2px 5px;margin-left:4px;flex:none;white-space:nowrap}
.gpus{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.gpu{background:var(--card-2);border-radius:10px;padding:12px 14px;min-width:0}
.gpu-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.gpu-h .k{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em}
.gpu-h .gn{font-weight:600;font-size:13.5px}
.gpu-h .s{font-size:12px;color:var(--ink-3)}
.gpu-h .v{font:600 20px/1.2 var(--mono)}
.rank .track{background:var(--track);border-radius:0 4px 4px 0}
.rank.gpu-rank{grid-template-columns:minmax(90px,160px) minmax(0,1fr) 54px}
.rank .sub{grid-column:1 / -1;font-size:12.5px;color:var(--ink-3)}
.tip{position:fixed;z-index:10;pointer-events:none;background:#0f0f11;border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;font-size:12.5px;color:var(--ink-2);box-shadow:0 10px 30px #000a;min-width:180px;max-width:300px}
.tip .t{color:var(--ink);font-weight:600;margin-bottom:2px}
.tip .u{color:var(--ink-3);font-size:11.5px;margin-bottom:6px}
.tip .r{display:flex;justify-content:space-between;align-items:center;gap:14px}
.tip .r span{display:inline-flex;align-items:center;gap:6px}
.tip .r b{font:500 12px/1.6 var(--mono);color:var(--ink)}

@media (max-width: 900px){
  .app{height:auto;min-height:100vh}
  .body{flex-direction:column}
  .side{width:auto;border-right:0;border-bottom:1px solid var(--line);max-height:52vh}
  main{overflow:visible}
  .wrap{padding:16px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .res{grid-template-columns:64px minmax(0,1fr)}
  .res .tot{grid-column:2;text-align:left}
  .kvs{grid-column:1 / -1}
  .hero-stats{margin-left:0}
  .hs{text-align:left}
  .mrow,.rank{grid-template-columns:minmax(0,1fr)}
  .rank .tot,.mrow .tot{text-align:left}
  .dl{grid-template-columns:minmax(0,1fr)}
}

/* ---- live additions ---- */
.space.pinned .unpin{display:grid;place-items:center;width:18px;height:18px;border-radius:5px;color:var(--ink-3);margin-left:-4px}
.space .unpin{display:none}
.space.pinned:hover .unpin,.space.pinned:focus-within .unpin{display:grid}
.space .unpin:hover{background:#ffffff18;color:var(--ink)}
.space .unpin svg{width:11px;height:11px}
.space.gone{opacity:.55}
.sdot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink-3)}
.sdot.ok{background:var(--run)}.sdot.offline{background:#e66100}.sdot.connecting{background:#f6d32d}.sdot.off,.sdot.hostonly{background:#77767b}
.pinbtn{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3);opacity:0;flex:none}
.row:hover .pinbtn,.row:focus-within .pinbtn,.pinbtn.on{opacity:1}
.pinbtn.on{color:var(--accent)}
.pinbtn:hover{background:var(--hover);color:var(--ink)}
.pinbtn svg{width:13px;height:13px}
.side-tabs{display:flex;gap:2px;margin:12px 12px 0;background:var(--chrome-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.side-tabs button{flex:1;padding:6px 8px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.side-tabs button[aria-pressed="true"]{background:#3a3a41;color:var(--ink)}
.row.offline .nm,.row.off .nm{color:var(--ink-3)}
.val.dim{color:var(--ink-3)}
.seg .sep-pill{width:1px;background:var(--line-2);margin:4px 2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;border:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2);font-weight:500}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn svg{width:13px;height:13px}
.btn.on{color:var(--accent);border-color:#78aeed66}
.warn{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:#e6610018;border:1px solid #e6610055;font-size:13px;color:var(--ink-2)}
.warn b{color:var(--ink)}
.dtools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.dtools input[type=search]{flex:1 1 220px;min-width:0;background:var(--side);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;color:var(--ink);font:13px var(--sans)}
.dtools label{font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
.dtools select{background:var(--side);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;color:var(--ink);font:13px var(--sans)}
.ptbl{width:100%;border-collapse:collapse;font-size:12.5px}
.ptbl th{position:sticky;top:0;background:var(--card);text-align:right;font-weight:500;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;padding:0;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.ptbl th button{width:100%;padding:7px 8px;text-align:inherit;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
.ptbl th button:hover{color:var(--ink)}
.ptbl th.l,.ptbl td.l{text-align:left}
.ptbl th[aria-sort] button{color:var(--ink)}
.ptbl td{padding:5px 8px;border-bottom:1px solid #ffffff0b;text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.ptbl td.l{font-family:var(--sans);font-size:12.5px}
.ptbl td.cmd{max-width:460px;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-align:left}
.ptbl tr.gh td{background:#ffffff08;color:var(--ink);font-family:var(--sans);font-weight:600;text-align:left;padding:0}
.ptbl tr.gh td span{color:var(--ink-3);font-weight:400;margin-left:10px;font-family:var(--mono);font-size:11.5px}
.ghbtn{display:flex;align-items:center;gap:7px;width:100%;padding:8px;color:var(--ink);font:600 12.5px/1.3 var(--sans);text-align:left}
.ghbtn:hover{background:#ffffff08}
.ghbtn svg{width:12px;height:12px;flex:none;color:var(--ink-3);transition:transform .12s}
.ghbtn[aria-expanded="true"] svg{transform:rotate(90deg)}
.ghbtn:focus-visible{outline-offset:-2px}
.dtools .gall{display:inline-flex;gap:6px;margin-left:auto}
.dfchips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.fchip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 4px 0 10px;border-radius:999px;background:#3584e424;border:1px solid #78aeed66;color:var(--ink);font-size:12.5px;font-weight:500;white-space:nowrap}
.fchip button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.fchip button:hover{background:#ffffff1a;color:var(--ink)}
.fchip button svg{width:11px;height:11px}
.dpanel .note{margin-bottom:12px}
.dfbar{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px}
.dfbar[hidden]{display:none}
.dfbar .dflabel{font-size:12px;font-weight:500;color:var(--ink-3);margin-right:2px}
.dfall{font-size:12px;font-weight:500;color:var(--accent);padding:4px 7px;border-radius:7px}
.dfall:hover{background:var(--hover)}
.seg button.filtered::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:2px}
.ptbl tr:hover td{background:#ffffff06}
.heat{display:inline-block;min-width:44px}
.pscroll{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--line);border-radius:10px}
.more{padding:10px;font-size:12.5px;color:var(--ink-3)}
.lgroups{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.lgh{display:flex;align-items:baseline;gap:10px;font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.lgh b{color:var(--ink);font-weight:600;font-size:13px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.lcell{position:relative;height:56px;border:1px solid var(--line);border-radius:7px;background:var(--card-2);overflow:hidden}
.lcell svg{position:absolute;inset:0;width:100%;height:100%}
.lcell .lt{position:absolute;left:6px;top:4px;font:500 10.5px/1 var(--mono);color:var(--ink-3)}
.lcell .lv{position:absolute;right:6px;top:4px;font:600 11.5px/1 var(--mono);color:var(--ink)}
.lcell .lm{position:absolute;left:6px;bottom:4px;font:500 10px/1 var(--mono);color:var(--ink-3)}
.conn{font:500 11px/1 var(--mono);color:#e66100}
.side-note svg{width:12px;height:12px;vertical-align:-2px;display:inline-block}

/* ---- settings, states ---- */
.setbtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;color:var(--ink-2);font:500 13px/1 var(--sans);flex:none;border:1px solid transparent}
.setbtn svg{width:16px;height:16px}
.setbtn:hover{background:var(--chrome-2);color:var(--ink);border-color:var(--line-2)}
.warn svg,.note svg{width:16px;height:16px;flex:none;margin-top:2px}
.warn svg{color:#ff9d62}
.linkbtn{color:var(--accent);text-decoration:underline;text-underline-offset:2px;margin-left:6px}
.spill{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;margin-left:10px;font:500 11.5px/1 var(--mono);color:#f6d32d;background:#f6d32d14;border:1px solid #f6d32d40;border-radius:999px;padding:4px 9px;letter-spacing:0}
.spill.okp{color:var(--run);background:#33d17a14;border-color:#33d17a40}
.spill.key,.spill.auth,.spill.dns,.spill.down,.spill.py,.spill.other{color:#ffa66b;background:#ff8a3d14;border-color:#ff8a3d40}
.spill.off,.spill.wait{color:var(--ink-3);background:#ffffff0a;border-color:var(--line-2)}
.sdot.stale{background:#f6d32d}
.row.stale .val{color:var(--ink-3)}
.state{display:flex;gap:22px;align-items:flex-start;max-width:760px;margin:28px 0 0;padding:28px 30px;background:linear-gradient(180deg,#2c2c31,#262629);border:1px solid var(--line-2);border-radius:16px}
.state-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;background:#ff8a3d1f;color:#ffa66b}
.state-ic svg{width:26px;height:26px}
.state-ic.off,.state-ic.wait{background:#ffffff10;color:var(--ink-2)}
.state-body{min-width:0;flex:1}
.state h2{margin:2px 0 8px;font-size:19px;font-weight:650;letter-spacing:-.01em}
.state p{margin:0 0 14px;color:var(--ink-2);font-size:14px;line-height:1.55}
.state code,.sheet code,.tres code{font:500 12.5px/1.4 var(--mono);background:#ffffff10;border-radius:5px;padding:1px 6px;color:var(--ink)}
.steps{margin:0 0 18px;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:baseline;color:var(--ink-2);font-size:13.5px;line-height:1.5}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#ffffff12;color:var(--ink);font:600 11.5px/1 var(--mono);transform:translateY(4px)}
.state-actions{display:flex;flex-wrap:wrap;gap:10px}
.btn.primary{background:var(--accent-bg);border-color:var(--accent-bg);color:#fff}
.btn.primary:hover{background:#4a90e8;color:#fff}
.btn[disabled]{opacity:.6;cursor:default}
.state-raw{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;font-size:12.5px;color:var(--ink-3)}
.state-raw summary{cursor:pointer;color:var(--ink-3);width:max-content}
.state-raw summary:hover{color:var(--ink-2)}
.state-raw code{display:block;margin:10px 0 6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.sheet-bg{position:fixed;inset:0;z-index:40;background:#0009;backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow:auto}
.sheet-bg[hidden]{display:none}
.sheet{width:min(820px,100%);background:#1d1d21;border:1px solid var(--line-2);border-radius:16px;box-shadow:0 30px 80px #000b;display:flex;flex-direction:column;max-height:88vh}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 10px}
.sheet-h h2{margin:0;font-size:18px;font-weight:650}
.sheet-b{padding:4px 22px 18px;overflow:auto;display:flex;flex-direction:column;gap:22px}
.sheet-b h3{margin:0 0 4px;font-size:14px;font-weight:600}
.sheet-b .sub{margin:0 0 12px;font-size:12.5px;color:var(--ink-3);line-height:1.5}
.sheet-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line)}
.sheet-err{margin:0 22px 4px;padding:10px 12px;border-radius:9px;background:#ff8a3d14;border:1px solid #ff8a3d40;color:#ffb98a;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.iconbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn svg{width:15px;height:15px}
.mcards{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.mcards{gap:6px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:12px}
.mcard.open{border-color:var(--line-2)}
.mcard-h{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:12px;text-align:left}
.mcard-h:hover{background:#ffffff06}
.mcard-h .spill{margin-left:auto}
.mcard-h .chev{width:16px;height:16px;color:var(--ink-3)}
.mcard-h .tile{width:26px;height:26px;border-radius:7px}
.mcard-h .tile svg{width:14px;height:14px}
.mtitle{display:flex;flex-direction:column;min-width:0;gap:2px}
.mlabel{font-weight:600;font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msum{font:500 11.5px/1.2 var(--mono);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbody{padding:2px 14px 14px 40px}
.btn.danger{margin-left:auto;color:#ff9b8a}
.btn.danger:hover{background:#ff6b5a18;color:#ffb3a6}
.termbtn{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;margin-left:12px;padding:5px 11px;border-radius:8px;border:1px solid var(--line-2);font:500 12.5px/1 var(--sans);color:var(--ink-2);letter-spacing:0}
.termbtn:hover{background:var(--hover);color:var(--ink);border-color:#ffffff40}
.termbtn svg{width:14px;height:14px}
.inline select{background:var(--side);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;color:var(--ink);font:13px var(--sans)}
.mname{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 7px;color:var(--ink);font:600 14px var(--sans)}
.mname:hover{border-color:var(--line-2)}
.mname:focus,.mgrid input:focus,.mgrid select:focus,.inline input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.mgrid label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--ink-3);min-width:0}
.mgrid label.wide{grid-column:1 / -1}
.mgrid input,.mgrid select{background:var(--side);border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;color:var(--ink);font:13px var(--sans);min-width:0}
.mgrid input{font-family:var(--mono);font-size:12.5px}
.mgrid .static{font-size:13px;color:var(--ink-2);padding:7px 0}
.adv{margin-top:10px}
.adv summary{cursor:pointer;font-size:12px;color:var(--ink-3);width:max-content}
.adv .mgrid{margin-top:10px}
.mtest{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.tres{font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.tres svg{width:14px;height:14px}
.tres.good{color:var(--run)}
.tres.bad{color:#ffa66b}
.inline{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.inline input{width:64px;background:var(--side);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;color:var(--ink);font:13px var(--mono)}
.scopeseg{display:inline-flex;gap:2px;background:var(--chrome-2);border:1px solid var(--line);border-radius:8px;padding:2px;vertical-align:middle;max-width:100%}
.scopeseg button{padding:4px 9px;border-radius:6px;font:500 12px/1.2 var(--sans);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.scopeseg button:hover{color:var(--ink)}
.scopeseg button[aria-pressed="true"]{background:#3a3a41;color:var(--ink);font-weight:600}
button.lcell{padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
button.lcell:hover{border-color:#ffffff40}
.lcell.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.lgbtn{font:600 13px/1.2 var(--sans);color:var(--ink);border-radius:6px;padding:2px 6px;margin-left:-6px}
.lgbtn:hover{background:var(--hover)}
.lgbtn.sel{color:var(--accent);background:#3584e41f}
.lhint{margin:-4px 2px 0;font-size:12.5px;color:var(--ink-3)}
.cpustats .hero-stats{margin:0 0 6px;justify-content:flex-start}
.cpustats .hs{text-align:left}
.cpuproc{margin:18px 0 8px;font-size:13.5px;font-weight:600}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:4px}
.gcell{position:relative;height:150px;border:1px solid var(--line);border-radius:10px;background:var(--card-2);overflow:hidden;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.gcell:hover{border-color:#ffffff40}
.gcell.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.gcell svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:62%}
.gcell .gk{position:absolute;left:10px;top:9px;font:500 11px/1 var(--mono);color:var(--ink-3)}
.gcell .gv{position:absolute;right:10px;top:8px;font:600 15px/1 var(--mono);color:var(--ink)}
.gcell .gn{position:absolute;left:10px;top:27px;right:10px;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcell .gm{position:absolute;left:10px;top:45px;font-size:11.5px;color:var(--ink-3)}
html.native .lights{display:none}
.split{display:flex;align-items:flex-start;min-height:100%}
.split>.wrap{flex:1 1 auto;min-width:0}
.dpanel{position:sticky;top:0;flex:none;max-width:70vw;height:calc(100vh - 112px);overflow:auto;border-left:1px solid var(--line-2);background:#1a1a1d;padding:14px 14px 24px}
.dpanel .card{padding:12px}
.dpanel .pscroll{max-height:none}
.dresize{position:sticky;top:0;float:left;margin:-14px 0 0 -18px;width:8px;height:calc(100vh - 112px);cursor:col-resize;touch-action:none}
.dresize:hover,.dresize:active{background:linear-gradient(90deg,transparent 3px,var(--accent) 3px,var(--accent) 5px,transparent 5px)}
.dhead{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.dtitle{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dtitle b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtitle span{font-size:12px;color:var(--ink-3)}
.dockzone{position:fixed;z-index:60;top:112px;right:0;bottom:0;width:45vw;border:2px dashed #78aeed66;border-radius:14px 0 0 14px;background:#3584e40d;display:grid;place-items:center;pointer-events:none;transition:background .12s,border-color .12s}
.dockzone.hot{background:#3584e42a;border-color:var(--accent)}
.dockzone div{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-2);font-size:13px}
.dockzone svg{width:28px;height:28px;color:var(--accent)}
.dockzone b{color:var(--ink);font-size:15px}
.empty-pins{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 18px;color:var(--ink-3);font-size:12.5px;line-height:1.5}
.empty-pins svg{width:22px;height:22px;color:var(--ink-3)}
.empty-pins b{color:var(--ink-2);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#2c2c31;border:1px solid var(--line-2);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 12px 30px #0008;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:700px){.mgrid{grid-template-columns:minmax(0,1fr)}.state{flex-direction:column;padding:22px}.setbtn span{display:none}}
.addpin{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3);flex:none;border:1px dashed #ffffff26}
.addpin svg{width:16px;height:16px}
.addpin:hover,.addpin[aria-expanded="true"]{background:var(--chrome-2);color:var(--ink);border-color:#ffffff45}
.picker{position:fixed;z-index:30;background:#18181b;border:1px solid var(--line-2);border-radius:12px;box-shadow:0 18px 50px #000c;display:flex;flex-direction:column;max-height:min(70vh,640px);overflow:hidden}
.picker[hidden]{display:none}
.pick-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.pick-h svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.pick-h input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font:14px var(--sans)}
.picklist{overflow:auto;padding:6px}
.prow{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:5px 10px;border-radius:8px;color:var(--ink-2);text-align:left}
.prow:hover,.prow:focus-visible{background:var(--hover);color:var(--ink)}
.prow .ico svg{width:15px;height:15px}
.prow .pn{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px}
.prow .pn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pw{font-size:11px;color:var(--ink-3)}
.prow .pk{font:500 10.5px/1 var(--mono);color:var(--ink-3);white-space:nowrap}
.prow .pp{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:999px;padding:3px 8px;flex:none}
.prow .pp svg{width:11px;height:11px}
.prow.on .pp{color:var(--accent);border-color:#78aeed66}
.pick-f{padding:9px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3)}
.pick-f b{color:var(--ink-2)}
.nrate{font:500 11px/1.25 var(--mono);color:var(--ink-3);flex:none;width:88px;display:flex;flex-direction:column;align-items:flex-start;white-space:nowrap}
.nrate span{overflow:hidden;text-overflow:ellipsis;max-width:100%}
</style>
</head>
<body>
<div class="app">
  <header class="spacebar">
    <div class="lights" aria-hidden="true"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <nav class="spaces" id="spaces" aria-label="Pinned spaces"></nav>
    <button type="button" class="setbtn" data-settings="1" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
  </header>
  <div class="toolbar">
    <nav class="crumbs" id="crumbs" aria-label="Path"></nav>
    <div class="dfbar" id="dfbar" role="group" aria-label="Details is filtered to" hidden></div>
    <div class="seg" id="metrics" role="group" aria-label="View"></div>
    <span class="conn" id="conn" hidden>reconnecting…</span>
    <span class="badge" id="live"><i></i>live</span>
  </div>
  <div class="body">
    <aside class="side" aria-label="Trees">
      <div class="side-tabs" role="group" aria-label="Tree"><button type="button" data-tree="machines">Machine tree</button><button type="button" data-tree="network">Network tree</button></div>
      <div class="side-h"><b id="tree-title">Machines</b><span id="tree-col"></span></div>
      <div class="tree" id="tree" role="tree"></div>
      <div id="side-note"></div>
    </aside>
    <main id="main"></main>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<div class="picker" id="picker" role="dialog" aria-label="Pin a grouping" hidden></div>
<div class="sheet-bg" id="sheet" hidden></div>
<script>if (new URLSearchParams(location.search).has("native")) document.documentElement.classList.add("native");</script>
<script src="app.js"></script>
</body>
</html>
